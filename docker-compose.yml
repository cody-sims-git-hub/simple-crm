# Production deployment for SimpleCRM.
# Runs on the shared external `proxy` network so the Caddy reverse proxy can
# reach it by container name (reverse_proxy crm-app:8080). TLS is handled by Caddy.
services:
  crm-app:
    build: .
    image: simple-crm:latest
    container_name: crm-app
    restart: unless-stopped
    environment:
      # Run the PHP process as the host user that owns ./.env (uid/gid 1000).
      #
      # The serversideup image defaults to www-data (uid 33). ./.env is mode 600
      # owned by 1000, so www-data could not read it: APP_KEY resolved empty,
      # every request that touched the encrypter threw MissingAppKeyException,
      # and AUTORUN_LARAVEL_CONFIG_CACHE below then cached that empty config at
      # boot. Every page 500'd from 2026-07-22 until this was fixed.
      #
      # Remapping the runtime user is preferable to loosening the file: .env
      # holds credentials and stays at 600.
      PUID: "1000"
      PGID: "1000"
      # serversideup init automations (read from process env, not Laravel's .env)
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
    volumes:
      # Laravel application config (created on the host from .env.production.example)
      - ./.env:/var/www/html/.env:ro
      # Persisted SQLite database — survives image rebuilds
      - crm-data:/data
    networks:
      - proxy
    healthcheck:
      # /login, not /up. The health route renders without touching the session
      # or the encrypter, so it answered 200 for the entire month the app was
      # returning 500 on every real page. A route that actually boots the
      # framework is the difference between noticing in seconds and in weeks.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true

volumes:
  crm-data:
